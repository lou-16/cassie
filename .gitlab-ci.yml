image: gcc:latest

stages:
  - build
  - test

before_script:
  - apt-get update && apt-get install -y cmake ninja-build curl

build:
  stage: build
  script:
    - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build

test:
  stage: test
  script:
    - ./build/server &
    - sleep 2
    - curl http://localhost:8080 | grep "Server is up and running"
